<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculty Dashboard</title>

    <link rel="icon" href="icons/qr-code.png" />
    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/button.css" />
    <link rel="stylesheet" href="css/faculty.css" />

    <!-- Applies any saved theme before first paint, so there's no flash of the wrong theme. -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      })();
    </script>

    <script src="/utils/auth-guard.js" type="module"></script>
  </head>

  <body>
    <header>
      <div class="left-section">
        <a class="brand-mark" href="homepage.html" aria-label="Go to homepage">
          <svg
            viewBox="0 0 40 40"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true">
            <rect x="1" y="1" width="38" height="38" rx="9" fill="#1F2B6C" />
            <rect x="9" y="9" width="8" height="8" fill="#F5F6F9" />
            <rect x="23" y="9" width="8" height="8" fill="#F5F6F9" />
            <rect x="9" y="23" width="8" height="8" fill="#F5F6F9" />
            <rect x="23" y="23" width="8" height="3" fill="#0E9C87" />
            <rect x="27" y="23" width="4" height="8" fill="#0E9C87" />
            <rect x="23" y="28" width="4" height="3" fill="#0E9C87" />
          </svg>
        </a>
      </div>
      <div class="middle-section page-title">Teacher Dashboard</div>
      <div class="right-section">
        <span class="user-name"><span class="user-name-prefix">Welcome, </span><b></b></span>

        <div class="profile-menu">
          <button
            id="profileBtn"
            class="avatar-btn"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="profileDropdown">
            <img id="avatarImg" alt="" hidden />
            <span id="avatarInitials" class="avatar-fallback"></span>
          </button>

          <div
            id="profileDropdown"
            class="profile-dropdown"
            aria-label="Profile menu"
            hidden>
            <!-- <a class="profile-menu-item" href="homepage.html">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M3 11l9-7 9 7" />
                <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" />
              </svg>
              Home
            </a> -->

            <div class="profile-menu-section">
              <p class="profile-menu-label">Theme</p>
              <div class="theme-toggle" role="group" aria-label="Theme">
                <button
                  type="button"
                  data-theme-choice="light"
                  aria-label="Light theme"
                  aria-pressed="false">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4" />
                    <path
                      d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                  </svg>
                </button>
                <button
                  type="button"
                  data-theme-choice="dark"
                  aria-label="Dark theme"
                  aria-pressed="false">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                  </svg>
                </button>
                <button
                  type="button"
                  data-theme-choice="system"
                  aria-label="Match system"
                  aria-pressed="false">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="12" rx="2" />
                    <path d="M8 20h8M12 16v4" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="profile-menu-divider"></div>

            <div
              class="logout-btn profile-menu-item"
              role="button"
              tabindex="0">
              <img src="icons/logout-black.svg" alt="" />
              <div>Log out</div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="app-shell">
      <nav class="sidebar">
        <div
          class="sidebar-content"
          id="generateQrNav"
          role="button"
          tabindex="0">
          <img src="icons/generate-qr.svg" alt="" />
          <div>Generate QR</div>
        </div>
        <div class="sidebar-content" id="historyNav" role="button" tabindex="0">
          <img src="icons/history.svg" alt="" />
          <div>History</div>
        </div>
        <div
          class="sidebar-content"
          id="feedbackNav"
          role="button"
          tabindex="0">
          <img src="icons/feedback.svg" alt="" />
          <div>Feedback</div>
        </div>
      </nav>

      <div class="app-content">
        <section id="beforeStart">
          <h2>Start a session</h2>
          <div id="sub-name"></div>
          <div>
            <label for="date">Date:</label>
            <input type="date" id="date" />
          </div>
          <div>
            <label for="session-type">Session type:</label>
            <select id="session-type">
              <option value="regular">Regular</option>
              <option value="arranged">Arranged</option>
            </select>
          </div>
          <div>
            <label for="slots">Select slot:</label>
            <select id="slots">
              <option value="" disabled selected>Select a slot</option>
            </select>
          </div>
          <div>
            <label for="attendance-method">Attendance method:</label>
            <select id="attendance-method">
              <option value="qr">QR Code</option>
              <option value="cctv">CCTV</option>
            </select>
          </div>
          <div id="class-selection" style="display: none">
            <label for="classes">Classes:</label>
            <div id="classes"></div>
          </div>
          <button id="startSessionBtn" class="btn-primary" type="button">
            Start session
          </button>
        </section>

        <section id="afterStart" style="display: none">
          <div class="canvas-stage">
            <canvas></canvas>
            <div class="canvas-scan-line" aria-hidden="true"></div>
            <div class="canvas-corner tl" aria-hidden="true"></div>
            <div class="canvas-corner br" aria-hidden="true"></div>
          </div>

          <div class="live-section">
            <abbr title="Toggle Fullscreen">
              <div
                class="toggle-fullscreen-btn"
                role="button"
                tabindex="0"
                aria-label="Toggle fullscreen"></div>
              <img
                class="toggle-fullscreen-icon"
                src="icons/fullscreen.svg"
                alt="" />
            </abbr>
            <p class="live-section-heading">Live Attendance</p>
            <div class="live-actions">
              <p id="studentCount">Present: 0</p>
              <div class="live-actions-buttons">
                <button
                  id="add-manually-btn"
                  class="button-secondary"
                  type="button">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
                  Add Manually
                </button>
                <button id="viewCctvResultBtn" class="button-secondary" type="button" disabled>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                  View CCTV Result
                </button>
                <button
                  id="submit-attendance-btn"
                  class="btn-primary"
                  type="button">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                  Submit
                </button>
              </div>
            </div>

            <ol id="studentList"></ol>
          </div>
        </section>
      </div>
    </div>

    <div
      id="cctvResultModal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-label="CCTV attendance result">
      <div class="modal-backdrop" data-modal-dismiss></div>
      <div class="modal-panel">
        <button type="button" class="modal-close" data-modal-dismiss aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <img id="cctvResultImage" src="" alt="CCTV attendance result" />
      </div>
    </div>

    <dialog id="manual-attendance-dialog">
      <h3>Select students to add</h3>

      <form method="dialog">
        <ol id="manual-attendance-list"></ol>
        <div class="dialog-actions">
          <button id="add-selected-btn" class="btn-primary" value="add">
            Add
          </button>
          <button
            id="closeDialog"
            class="button-secondary"
            value="cancel">
            Cancel
          </button>
        </div>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/faculty.js" type="module"></script>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script defer src="js/theme.js" type="module"></script>
    <script defer src="js/faculty-ui.js" type="module"></script>

    <!-- Enter/Space activates the sidebar items, fullscreen button, and logout (js/faculty.js only listens for click) -->
    <script>
      document
        .querySelectorAll(
          '.sidebar-content[role="button"], .toggle-fullscreen-btn[role="button"], .logout-btn[role="button"]'
        )
        .forEach(function (el) {
          el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              el.click();
            }
          });
        });
    </script>
  </body>
</html>
