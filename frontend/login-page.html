<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login page</title>

    <link rel="icon" href="icons/qr-code.png" />
    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="css/button.css" />
    <link rel="stylesheet" href="css/loginpage.css" />

    <!-- Applies any saved theme before first paint, so there's no flash of the wrong theme. -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      })();
    </script>

    <script defer src="js/login-page.js" type="module"></script>
    <script defer src="js/theme.js" type="module"></script>
  </head>

  <body>
    <header class="site-header">
      <div class="container bar">
        <div class="brand">
          <svg class="mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="1" y="1" width="38" height="38" rx="9" fill="#1F2B6C" />
            <rect x="9" y="9" width="8" height="8" fill="#F5F6F9" />
            <rect x="23" y="9" width="8" height="8" fill="#F5F6F9" />
            <rect x="9" y="23" width="8" height="8" fill="#F5F6F9" />
            <rect x="23" y="23" width="8" height="3" fill="#0E9C87" />
            <rect x="27" y="23" width="4" height="8" fill="#0E9C87" />
            <rect x="23" y="28" width="4" height="3" fill="#0E9C87" />
          </svg>
          <p class="wordmark">Institute<span>Attend</span></p>
        </div>

        <div class="theme-toggle" role="group" aria-label="Theme">
          <button type="button" data-theme-choice="light" aria-label="Light theme" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button type="button" data-theme-choice="dark" aria-label="Dark theme" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <button type="button" data-theme-choice="system" aria-label="Match system" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main>
      <a class="back-link" href="homepage.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Back to home
      </a>

      <div class="auth-card">
        <div class="auth-head">
          <img class="qr-logo" src="icons/generate-qr.svg" alt="" />
          <h1>Sign in</h1>
          <p class="signInMsg"></p>
        </div>

        <form id="loginForm" novalidate onsubmit="return false">
          <label class="field">
            <span class="field-label">Username</span>
            <input type="text" id="username" placeholder="✉ Username" autocomplete="username" />
          </label>

          <label class="field field-password">
            <span class="field-label">Password</span>
            <input type="password" id="password" placeholder="🔒 Password" autocomplete="current-password" />
            <img class="view-password-icon" src="icons/view-password.svg" alt="Show password" />
          </label>

          <div class="row-end">
            <p class="forgot-password-link link-plain" role="button" tabindex="0">Forgot password?</p>
          </div>

          <button type="button" id="loginBtn" class="btn-primary">Sign in</button>
          <p id="login-msg" role="alert"></p>
        </form>
      </div>
    </main>
  </body>
</html>
