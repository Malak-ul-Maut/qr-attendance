<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | Attendance System</title>

    <link rel="icon" href="icons/qr-code.png" />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/loginpage.css" />

    <script defer src="js/login-page.js" type="module"></script>
  </head>

  <body>
    <main class="login-page">
      <button
        class="icon-btn theme-toggle login-theme-toggle"
        type="button"
        aria-pressed="false"
        aria-label="Switch to dark theme">
        <svg
          class="icon-moon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
        </svg>
        <svg
          class="icon-sun"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
      <a class="login-brand" href="homepage.html">
        <img
          src="icons/mit-logo.png"
          alt="Meerut Institute of Technology, back to home" />
      </a>

      <section class="login-card card">
        <div class="login-banner" aria-hidden="true"></div>

        <div class="login-body">
          <a class="back-link" href="homepage.html">Change role</a>

          <h1 class="signInMsg">Sign in</h1>
          <p class="login-sub">
            Use the username and password given by your college.
          </p>

          <form id="loginForm" novalidate>
            <div class="field">
              <label for="username">Username</label>
              <input
                class="input"
                type="text"
                id="username"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false" />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="input-group">
                <input
                  class="input"
                  type="password"
                  id="password"
                  autocomplete="current-password" />
                <button
                  class="input-toggle"
                  id="togglePassword"
                  type="button"
                  aria-pressed="false">
                  Show
                </button>
              </div>
            </div>

            <p
              id="login-msg"
              class="alert alert-danger"
              role="alert"
              hidden></p>

            <button
              id="loginBtn"
              class="btn btn-primary btn-block"
              type="submit">
              Sign in
            </button>

            <button id="forgotPassword" class="link-btn" type="button">
              Forgot password?
            </button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
