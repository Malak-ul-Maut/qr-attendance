        <section class="login-card card" aria-labelledby="signInTitle">
          <a class="back-link" href="homepage.html">Change role</a>

          <h1 id="signInTitle" class="signInMsg">Sign in</h1>
          <p class="login-sub">Use the username and password from your college.</p>

          <form id="loginForm" novalidate>
            <div class="field">
              <label for="username">Username</label>
              <input
                class="input"
                type="text"
                id="username"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false" />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="input-group">
                <input
                  class="input"
                  type="password"
                  id="password"
                  autocomplete="current-password" />
                <button
                  class="input-toggle"
                  id="togglePassword"
                  type="button"
                  aria-label="Show password"
                  aria-pressed="false">
                  <svg class="eye-on" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></svg>
                  <svg class="eye-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l18 18" /><path d="M10.600 5.100A10.500 10.500 0 0 1 12 5c6.400 0 10 7 10 7a17 17 0 0 1-3.200 4.200M6.600 6.600A16.600 16.600 0 0 0 2 12s3.600 7 10 7a9.800 9.800 0 0 0 4.200-.9" /><path d="M9.900 9.900a3 3 0 0 0 4.200 4.200" /></svg>
                </button>
              </div>
            </div>

            <p
              id="login-msg"
              class="alert alert-danger"
              role="alert"
              hidden></p>

            <button
              id="loginBtn"
              class="btn btn-primary btn-block"
              type="submit">
              Sign in
            </button>

            <button id="forgotPassword" class="link-btn" type="button">
              Forgot password?
            </button>
          </form>
        </section>
