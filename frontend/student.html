<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student | Attendance System</title>
    <link rel="icon" href="icons/qr-code.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/student.css" />

    <script src="js/theme.js"></script>
    <script src="utils/auth-guard.js" type="module"></script>
    <script src="utils/cache-models.js"></script>
    <!-- Shared ONNX runtime for face detection, liveness, and recognition -->
    <script src="/utils/ort/ort.wasm.min.js"></script>
    <script defer src="js/app.js" type="module"></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="app-header">
      <a class="brand" href="student.html"
        ><img src="icons/mit-logo.png" alt="MIT"
      /></a>
      <span class="user-name">Hi, <b></b></span>
      <button
        class="icon-btn theme-toggle"
        type="button"
        aria-pressed="false"
        aria-label="Switch to dark theme">
        <svg
          class="icon-moon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
        </svg>
        <svg
          class="icon-sun"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
    </header>

    <nav class="app-nav" aria-label="Student sections">
      <button
        class="nav-item"
        type="button"
        data-view="today"
        aria-current="page">
        <img src="icons/home.svg" alt="" />Today
      </button>
      <button class="nav-item" type="button" data-view="attendance">
        <img src="icons/courses.svg" alt="" />Attendance
      </button>
      <button class="nav-item" type="button" data-view="profile">
        <img src="icons/student.svg" alt="" />Profile
      </button>
    </nav>

    <main id="main" class="app-main">
      <!-- Today -->
      <section id="view-today" class="view">
        <h1 id="todayGreeting" class="student-greeting" tabindex="-1">Today</h1>
        <p id="todaySub" class="student-sub"></p>
        <div id="todayRoot" aria-live="polite"></div>
      </section>

      <!-- Attendance -->
      <section id="view-attendance" class="view" hidden>
        <h1 class="section-title" tabindex="-1">Attendance</h1>
        <div id="attendanceRoot"></div>
      </section>

      <!-- Profile -->
      <section id="view-profile" class="view" hidden>
        <h1 class="section-title" tabindex="-1">Profile</h1>
        <div id="profileRoot"></div>
      </section>
    </main>

    <!-- Guided scan flow: Scan QR -> Verify face -> Done -->
    <div
      id="scanner-section"
      role="dialog"
      aria-modal="true"
      aria-labelledby="scanTitle"
      hidden>
      <div class="scan-top">
        <h2 id="scanTitle">Mark attendance</h2>
        <button id="closeScanBtn" class="btn btn-secondary" type="button">
          Cancel
        </button>
      </div>

      <ol class="steps" aria-label="Progress">
        <li data-step="1">1. Scan QR</li>
        <li data-step="2">2. Verify face</li>
        <li data-step="3">3. Done</li>
      </ol>

      <div id="cameraArea">
        <div class="camera-wrapper">
          <video
            id="video"
            autoplay
            playsinline
            muted
            aria-label="Camera preview"></video>
          <canvas id="overlay" aria-hidden="true"></canvas>
        </div>
        <div class="slider-row" id="zoomRow">
          <button type="button" class="slider-icon left" aria-label="Zoom out">
            <img src="icons/zoom-out.svg" alt="" />
          </button>
          <input
            id="zoom-slider"
            type="range"
            min="1"
            max="5"
            step="0.1"
            value="1"
            aria-label="Zoom" />
          <button type="button" class="slider-icon right" aria-label="Zoom in">
            <img src="icons/zoom-in.svg" alt="" />
          </button>
        </div>
      </div>
      <p id="scan-result" role="status"></p>

      <div id="resultPanel" class="card result-panel" hidden>
        <div class="result-icon" aria-hidden="true"></div>
        <h2 id="resultTitle" tabindex="-1"></h2>
        <p id="resultText"></p>
        <p id="resultTip" class="result-tip" hidden></p>
        <dl id="receipt" class="receipt" hidden></dl>
        <button
          id="resultAction"
          class="btn btn-primary"
          type="button"></button>
        <button
          id="resultSecondary"
          class="btn btn-secondary"
          type="button"
          hidden></button>
        <details id="resultDetails" class="result-details" hidden>
          <summary>Details</summary>
          <p id="resultCode"></p>
        </details>
      </div>
    </div>

    <!-- Face enrolment and camera self-test -->
    <div
      id="capture-section"
      role="dialog"
      aria-modal="true"
      aria-labelledby="captureHeading"
      hidden>
      <div class="scan-top">
        <h2 id="captureHeading">Add your face photos</h2>
        <button id="captureCancel" class="btn btn-secondary" type="button">
          Cancel
        </button>
      </div>
      <ol id="captureDots" class="dots" aria-label="Photos taken"></ol>
      <div id="captureCamera">
        <div class="camera-wrapper mirrored">
          <video
            id="captureVideo"
            autoplay
            playsinline
            muted
            aria-label="Camera preview"></video>
          <canvas id="captureOverlay" aria-hidden="true"></canvas>
        </div>
        <h3 id="captureInstruction"></h3>
        <p id="captureHint"></p>
      </div>
      <div id="captureLoading" hidden>
        <p id="captureLoadingText" role="status"></p>
        <progress id="captureProgress" max="100"></progress>
        <p id="captureLoadingNote"></p>
      </div>
      <p id="captureStatus" role="status"></p>
      <div id="capturePanel" class="card result-panel" hidden></div>
    </div>
  </body>
</html>
