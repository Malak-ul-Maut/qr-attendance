<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Attendance</title>
    <link rel="icon" href="icons/qr-code.png" />
    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/card.css" />
    <link rel="stylesheet" href="css/student.css" />

    <!-- Applies any saved theme before first paint, so there's no flash of the wrong theme. -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      })();
    </script>

    <script src="utils/auth-guard.js" type="module"></script>
    <script src="utils/cache-models.js"></script>
    <script defer src="utils/face-api.js"></script>
    <script defer src="js/student.js" type="module"></script>
  </head>

  <body>
    <header>
      <div class="left-section">
        <a class="brand-mark" href="homepage.html" aria-label="Go to homepage">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="1" y="1" width="38" height="38" rx="9" fill="#1F2B6C" />
            <rect x="9" y="9" width="8" height="8" fill="#F5F6F9" />
            <rect x="23" y="9" width="8" height="8" fill="#F5F6F9" />
            <rect x="9" y="23" width="8" height="8" fill="#F5F6F9" />
            <rect x="23" y="23" width="8" height="3" fill="#0E9C87" />
            <rect x="27" y="23" width="4" height="8" fill="#0E9C87" />
            <rect x="23" y="28" width="4" height="3" fill="#0E9C87" />
          </svg>
        </a>
      </div>

      <div class="middle-section">
        <span class="user-name"> <b></b></span>
      </div>

      <div class="right-section">
        <div class="profile-menu">
          <button
            id="profileBtn"
            class="avatar-btn"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="profileDropdown">
            <img id="avatarImg" alt="" hidden />
            <span id="avatarInitials" class="avatar-fallback"></span>
          </button>

          <div id="profileDropdown" class="profile-dropdown" aria-label="Profile menu" hidden>
            <a class="profile-menu-item" href="homepage.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
              Home
            </a>

            <div class="profile-menu-section">
              <p class="profile-menu-label">Theme</p>
              <div class="theme-toggle" role="group" aria-label="Theme">
                <button type="button" data-theme-choice="light" aria-label="Light theme" aria-pressed="false">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>
                <button type="button" data-theme-choice="dark" aria-label="Dark theme" aria-pressed="false">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                </button>
                <button type="button" data-theme-choice="system" aria-label="Match system" aria-pressed="false">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
                </button>
              </div>
            </div>

            <div class="profile-menu-divider"></div>

            <div class="logout-btn profile-menu-item" id="logoutBtn" role="button" tabindex="0">
              <img src="icons/logout.svg" alt="" />
              <div>Log out</div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div id="scanner-section" style="display: none">
      <button id="closeScanBtn" type="button" aria-label="Close scanner">✕</button>

      <ol id="scanSteps" class="scan-steps">
        <li data-step="qr" class="active"><span class="dot">1</span>Scan QR</li>
        <li data-step="face"><span class="dot">2</span>Face check</li>
      </ol>

      <div class="camera-wrapper">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>

      <div class="slider-row">
        <img src="icons/zoom-out.svg" class="slider-icon left" alt="zoom out" />
        <input
          id="zoom-slider"
          type="range"
          min="1"
          max="5"
          step="0.1"
          value="1"
          aria-label="Camera zoom" />
        <img src="icons/zoom-in.svg" class="slider-icon right" alt="zoom in" />
      </div>

      <p id="scan-result" role="status"></p>
    </div>

    <main>
      <div class="roles">
        <div id="markAttendanceCard" class="link-card" role="button" tabindex="0">
          <img src="icons/generate-qr.svg" alt="" />
          <p>Mark attendance</p>
        </div>

        <div class="link-card" role="button" tabindex="0">
          <img src="icons/courses.svg" alt="" />
          <p>Subjects</p>
        </div>

        <div class="link-card" role="button" tabindex="0">
          <img src="icons/history.svg" alt="" />
          <p>History</p>
        </div>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script defer src="js/theme.js" type="module"></script>
    <script defer src="js/student-ui.js" type="module"></script>

    <!-- Enter/Space activates the focusable tiles and the logout button (js/student.js only listens for click) -->
    <script>
      document
        .querySelectorAll('.link-card[role="button"], .logout-btn[role="button"]')
        .forEach(function (el) {
          el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              el.click();
            }
          });
        });
    </script>
  </body>
</html>
